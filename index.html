<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andrew Favour's To-Do - Stay Productive</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2,#f093fb,#f5576c);background-size:300% 300%;animation:bgMove 10s ease infinite;display:flex;justify-content:center;padding:20px}
@keyframes bgMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.card{background:rgba(255,255,255,0.95);width:100%;max-width:430px;padding:25px;border-radius:25px;box-shadow:0 20px 40px rgba(0,0,0,0.25);margin-top:20px;animation:pop 0.6s ease}
@keyframes pop{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
h1{margin:0;font-size:28px;background:linear-gradient(90deg,#6c5ce7,#e84393);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.subtitle{text-align:center;color:#888;font-size:13px;margin:5px 0 15px}
.progress-bg{background:#eee;height:10px;border-radius:20px;overflow:hidden}
#progress{height:100%;width:0%;background:linear-gradient(90deg,#00b894,#00cec9);transition:0.5s;border-radius:20px}
#progressText{text-align:center;font-size:12px;color:#666;margin:6px 0 15px}
.input-row{display:flex;gap:8px}
input{flex:1;padding:13px;border:2px solid #eee;border-radius:12px;outline:none;font-size:15px}
input:focus{border-color:#6c5ce7}
.addBtn{padding:13px 18px;border:none;border-radius:12px;background:linear-gradient(90deg,#6c5ce7,#a29bfe);color:white;font-weight:bold;cursor:pointer}
.filters{display:flex;gap:6px;margin:15px 0}
.filters button{flex:1;padding:8px;border:none;border-radius:20px;background:#f1f1f1;cursor:pointer;font-size:12px}
.filters button.active{background:#6c5ce7;color:white}
ul{list-style:none;padding:0;margin:0}
li{background:#f8f9ff;padding:13px 12px;margin-bottom:10px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;animation:slide 0.4s ease;border-left:4px solid #6c5ce7}
@keyframes slide{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
li.done{opacity:0.5;border-left-color:#00b894}
li.done span{text-decoration:line-through}
li span{cursor:pointer;flex:1}
.del{border:none;background:#ffe0e0;color:#d63031;padding:6px 10px;border-radius:8px;cursor:pointer;margin-left:8px}
.footer{text-align:center;color:#aaa;font-size:11px;margin-top:15px}
.badge{display:inline-block;background:#ffeaa7;padding:3px 10px;border-radius:20px;font-size:11px}
</style>
</head>
<body>
<div class="card">
<h1>✨ My To-Do List</h1>
<p class="subtitle">by Andrew Favour • <span class="badge">🟢 LIVE ONLINE</span><br>Tap a task to mark it done!</p>
<div class="progress-bg"><div id="progress"></div></div>
<p id="progressText">0% done — Let's go! 🔥</p>
<div class="input-row">
<input id="task" placeholder="✍️ What do you need to do?">
<button class="addBtn" onclick="addTask()">+ Add</button>
</div>
<div class="filters">
<button onclick="filterTasks('all',this)" class="active">All</button>
<button onclick="filterTasks('active',this)">Active</button>
<button onclick="filterTasks('done',this)">Done ✅</button>
</div>
<ul id="list"></ul>
<p class="footer">Made with ❤️ by Andrew</p>
</div>
<script>
let tasks = JSON.parse(localStorage.getItem("myTasks") || "[]");
let currentFilter = "all";
function save(){ localStorage.setItem("myTasks", JSON.stringify(tasks)); }
function updateProgress(){
  let done = tasks.filter(t=>t.done).length;
  let pct = tasks.length ? Math.round(done/tasks.length*100) : 0;
  document.getElementById("progress").style.width = pct+"%";
  document.getElementById("progressText").innerText = pct+"% done — " + (pct==100 && tasks.length ? "🎉 You finished everything!" : "Keep going! 🔥");
}
function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";
  tasks.forEach((t,i)=>{
    if(currentFilter=="active" && t.done) return;
    if(currentFilter=="done" && !t.done) return;
    let li = document.createElement("li");
    if(t.done) li.classList.add("done");
    li.innerHTML = "<span onclick='toggleTask("+i+")'>"+t.text+"</span><button class='del' onclick='deleteTask("+i+")'>🗑️</button>";
    list.appendChild(li);
  });
  updateProgress();
}
function addTask(){
  let input = document.getElementById("task");
  if(!input.value.trim()) return;
  tasks.push({text: input.value, done:false});
  save(); render(); input.value = ""; input.focus();
}
function toggleTask(i){ tasks[i].done = !tasks[i].done; save(); render(); }
function deleteTask(i){ tasks.splice(i,1); save(); render(); }
function filterTasks(f,btn){
  currentFilter = f;
  document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active"); render();
}
document.getElementById("task").addEventListener("keypress", e=>{ if(e.key=="Enter") addTask(); });
render();
</script>
</body>
</html>
